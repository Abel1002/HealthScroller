services:
  health-scroller:
    build: .
    container_name: health-scroller
    environment:
      # El chatbot dentro del contenedor usa el Ollama instalado en el host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:1b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Necesario para que el chat interactivo (input()) funcione
    stdin_open: true
    tty: true
