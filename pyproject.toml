[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-scroller"
version = "1.0.0"
description = "Chatbot multi-agente sobre el impacto de las redes sociales en estudiantes (proyecto educativo)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "langchain>=0.3,<0.4",
    "langchain-ollama>=0.3,<0.4",
    "langgraph>=0.3,<0.6",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
healthscroller = "health_scroller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
